name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The image of the build environment, in GHCR under the hash of the files it is made of
  # (see tools/jetio-dev image). Made only if that hash is not there yet.
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - name: Make and push the image if it is missing
        run: |
          export JETIO_IMAGE_REPO="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/jetio-dev"
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          image=$(tools/jetio-dev image --name)
          if docker manifest inspect "$image" >/dev/null 2>&1; then
            echo "$image exists"
          else
            tools/jetio-dev image
            docker push "$image"
          fi

  build:
    name: ${{ matrix.preset }}
    needs: image
    # Pinned: the toolchain is the one of the container image, the runner only provides Docker.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: linux-x64-gcc-debug
          - preset: linux-x64-clang-debug
          - preset: linux-x64-clang-libcxx-debug
          - preset: linux-x64-gcc-release-audit
            bench: linux-x64-gcc-release-audit-bench
          - preset: linux-x64-clang-asan
          - preset: linux-x64-clang-tsan
          - preset: linux-x64-clang-fuzz
    steps:
      - uses: actions/checkout@v7
      - name: Log in to GHCR and name the image
        run: |
          echo "JETIO_IMAGE_REPO=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/jetio-dev" >> "$GITHUB_ENV"
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      # The compiler cache of the container is build/ccache of the checkout
      - uses: actions/cache@v6
        with:
          path: build/ccache
          key: ccache-${{ matrix.preset }}-${{ github.sha }}
          restore-keys: ccache-${{ matrix.preset }}-
      - name: Configure
        run: tools/jetio-dev configure -p ${{ matrix.preset }}
      - name: Build
        run: tools/jetio-dev build -p ${{ matrix.preset }}
      - name: Test
        run: tools/jetio-dev test -p ${{ matrix.preset }}
      - name: Benchmark smoke run
        if: matrix.bench
        run: tools/jetio-dev test -p ${{ matrix.bench }}
      - name: Compiler cache statistics
        if: always()
        run: tools/jetio-dev ccache
